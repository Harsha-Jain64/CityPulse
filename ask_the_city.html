<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CityPulse | Ask the City Intelligence Hub</title>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">

    <style>
        :root { --accent: #38bdf8; --bg: #0f172a; --panel: #1e293b; --text: #94a3b8; --danger: #ef4444; --success: #22c55e; }
        body { font-family: 'Plus Jakarta Sans', sans-serif; margin: 0; background: var(--bg); color: white; overflow: hidden; }
        
        .master-container { display: flex; height: 100vh; padding: 20px; gap: 20px; box-sizing: border-box; }

        /* Left Panel: Chat & Intelligence */
        .sidebar { width: 480px; background: var(--panel); border-radius: 16px; padding: 25px; display: flex; flex-direction: column; box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5); }
        h2 { margin: 0; font-size: 1.4rem; display: flex; align-items: center; gap: 10px; }
        .live-tag { background: rgba(34, 197, 94, 0.2); color: var(--success); font-size: 0.6rem; padding: 4px 8px; border-radius: 4px; border: 1px solid var(--success); }

        /* Pre-set Audit Buttons */
        .audit-grid { display: grid; grid-template-columns: 1fr; gap: 10px; margin: 20px 0; }
        .audit-btn { background: #334155; border: 1px solid #475569; color: white; padding: 12px; border-radius: 10px; text-align: left; cursor: pointer; transition: 0.3s; font-size: 0.85rem; font-weight: 600; }
        .audit-btn:hover { border-color: var(--accent); background: #3d4d61; }

        /* Thought Stream & Response */
        #response-container { flex: 1; overflow-y: auto; margin-top: 10px; padding-right: 10px; }
        .thought-stream { font-family: monospace; font-size: 0.75rem; color: var(--accent); margin-bottom: 15px; border-left: 2px solid var(--accent); padding-left: 10px; opacity: 0.8; }
        
        /* Intelligence Card */
        .insight-card { background: #0f172a; border-radius: 12px; padding: 20px; border: 1px solid #334155; animation: slideIn 0.4s ease-out; }
        @keyframes slideIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .badge { font-size: 0.65rem; font-weight: 800; text-transform: uppercase; padding: 4px 10px; border-radius: 20px; }
        .badge.danger { background: rgba(239, 68, 68, 0.2); color: var(--danger); border: 1px solid var(--danger); }
        .badge.warning { background: rgba(251, 191, 36, 0.2); color: #fbbf24; border: 1px solid #fbbf24; }

        .factor-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 15px 0; }
        .factor { background: #1e293b; padding: 10px; border-radius: 8px; font-size: 0.75rem; }
        .factor b { display: block; color: var(--accent); margin-bottom: 2px; }

        .action-bar { display: flex; gap: 10px; margin-top: 15px; }
        .action-btn { flex: 1; padding: 8px; border-radius: 6px; border: none; font-size: 0.75rem; font-weight: 700; cursor: pointer; }
        .btn-forward { background: var(--success); color: white; }
        .btn-locate { background: var(--accent); color: var(--bg); }

        /* Map UI */
        #map { flex: 1; border-radius: 16px; border: 1px solid #334155; position: relative; }
        .map-overlay { position: absolute; top: 15px; right: 15px; background: rgba(15, 23, 42, 0.8); padding: 8px 15px; border-radius: 20px; font-size: 0.7rem; z-index: 1000; border: 1px solid var(--accent); }
    </style>
</head>
<body>

<div class="master-container">
    <div class="sidebar">
        <h2>CityPulse AI <span class="live-tag">LIVE SAT-STREAM</span></h2>
        
        <div class="audit-grid">
            <button class="audit-btn" onclick="runInference('school')">🏫 School Safety Highway Audit</button>
            <button class="audit-btn" onclick="runInference('ev')">⚡ EV Grid Optimization Plan</button>
            <button class="audit-btn" onclick="runInference('flood')">🌊 2030 Inundation Forecast</button>
        </div>

        <div id="response-container">
            <div class="thought-stream" id="thought-stream" style="display:none;"></div>
            <div id="intelligence-card"></div>
        </div>
    </div>

    <div id="map">
        <div class="map-overlay" id="map-status">ENGINE IDLE: AWAITING QUERY</div>
    </div>
</div>

<script>
    let map, activeLayer;

    function initMap() {
        map = L.map('map', { zoomControl: false }).setView([28.6289, 77.3649], 15);
        L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
            attribution: 'Esri Satellite'
        }).addTo(map);
    }

    const cityBrain = {
        school: {
            title: "School Zone Safety Risk",
            badge: "danger",
            text: "Detected 12 high-priority school zones within 500m of National Highway 24. AI analysis reveals lack of speed governors and pedestrian overpasses.",
            social: "1,200+ students at high risk daily. Footfall exceeds road capacity.",
            economic: "Potential ₹14.5L/yr reduction in emergency healthcare costs.",
            resource: "Nearest critical care unit is 4.2km away (High Latency Zone).",
            sustain: "Aligns with SDG 3.6: Half global road traffic deaths.",
            source: "Source: OGD School Census + NHAI Polyline Data",
            latlng: [28.625, 77.365],
            zoom: 17,
            dept: "Public Works Dept (PWD)"
        },
        ev: {
            title: "EV Grid Optimization",
            badge: "warning",
            text: "Identified 8 optimal clusters for DC Fast Charging. Prioritizing locations with <200m distance from 11kV transformers.",
            social: "Increases clean mobility access for 45,000 ward residents.",
            economic: "Projected ₹2.2Cr annual revenue for Municipal Corp.",
            resource: "Utilizes 15% spare grid capacity without transformer upgrade.",
            sustain: "SDG 7.2: Increase share of renewable energy.",
            source: "Source: DISCOM Load Maps + Bhuvan POI Data",
            latlng: [28.632, 77.368],
            zoom: 16,
            dept: "Energy & Utilities Dept"
        },
        flood: {
            title: "2030 Inundation Model",
            badge: "danger",
            text: "Topological flow analysis indicates severe water logging risk in Sector 62. Projected rainfall increase: +18% by 2030.",
            social: "Risk of displacement for 3,500 low-income households.",
            economic: "₹8.2Cr projected infrastructure damage if drainage is not expanded.",
            resource: "Current culvert capacity is 40% below 2030 requirements.",
            sustain: "SDG 13.1: Strengthen resilience to climate disasters.",
            source: "Source: NASA SRTM (DEM) + IMD Precipitation Trends",
            latlng: [28.628, 77.360],
            zoom: 16,
            dept: "Disaster Management Authority"
        }
    };

    function runInference(type) {
        const data = cityBrain[type];
        const thought = document.getElementById('thought-stream');
        const card = document.getElementById('intelligence-card');
        
        // Reset UI
        card.innerHTML = "";
        thought.style.display = "block";
        thought.innerText = "Initializing Inference Thought-Stream...\n> Accessing Remote Sensing Data...\n> Cross-referencing Policy Mandates...\n> Calculating Multi-dimensional ROI...";

        // Simulate "Thinking" time
        setTimeout(() => {
            thought.style.display = "none";
            document.getElementById('map-status').innerText = `ANALYZING: ${data.title.toUpperCase()}`;
            
            // Map Reaction
            if(activeLayer) map.removeLayer(activeLayer);
            map.flyTo(data.latlng, data.zoom);
            activeLayer = L.circle(data.latlng, {
                color: data.badge === 'danger' ? '#ef4444' : '#fbbf24',
                fillColor: data.badge === 'danger' ? '#ef4444' : '#fbbf24',
                fillOpacity: 0.3, radius: 400
            }).addTo(map).bindPopup(data.title).openPopup();

            // Render Intelligence Card
            card.innerHTML = `
                <div class="insight-card">
                    <div class="card-header">
                        <span class="badge ${data.badge}">${data.title}</span>
                        <small style="color:var(--text)">Confidence: 94.2%</small>
                    </div>
                    <p style="font-size:0.85rem; margin: 0 0 15px 0;">${data.text}</p>
                    
                    <div class="factor-grid">
                        <div class="factor"><b>🤝 Social Impact</b>${data.social}</div>
                        <div class="factor"><b>💰 Economic ROI</b>${data.economic}</div>
                        <div class="factor"><b>🛠 Resource Audit</b>${data.resource}</div>
                        <div class="factor"><b>🌍 Sustainability</b>${data.sustain}</div>
                    </div>

                    <div class="action-bar">
                        <button class="action-btn btn-locate" onclick="map.flyTo([${data.latlng}], ${data.zoom})">📍 Locate Cluster</button>
                        <button class="action-btn btn-forward" onclick="alert('Insight forwarded to ${data.dept}')">📤 Forward to Dept</button>
                    </div>
                    
                    <div style="font-size:0.6rem; color:var(--text); margin-top:15px; text-align:center; border-top: 1px solid #334155; padding-top:10px;">
                        ${data.source}
                    </div>
                </div>
            `;
        }, 1500);
    }

    window.onload = initMap;
</script>

</body>
</html>
