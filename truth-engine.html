<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Truth Engine | National Forensic Lab</title>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/jieter/leaflet.sync/L.Map.Sync.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono&family=Plus+Jakarta+Sans:wght@400;700;800&display=swap" rel="stylesheet">
    
    <style>
        :root { --bg: #020617; --card: #0f172a; --accent: #38bdf8; --border: #1e293b; --danger: #ef4444; --success: #22c55e; --warning: #f59e0b; }
        body { font-family: 'Plus Jakarta Sans', sans-serif; background: var(--bg); color: #f8fafc; margin: 0; display: grid; grid-template-columns: 1fr 450px; height: 100vh; overflow: hidden; }
        
        /* VIEWPORT SECTION */
        .viewport { position: relative; border-right: 1px solid var(--border); display: flex; flex-direction: column; }
        .map-grid { display: grid; grid-template-columns: 1fr 1fr; flex: 1; gap: 2px; background: var(--border); }
        .map-frame { width: 100%; height: 100%; transition: filter 0.5s ease; }
        .ai-mask-active { filter: saturate(2.5) contrast(1.2) hue-rotate(-15deg) brightness(1.1); }
        
        .hud-top { position: absolute; top: 20px; left: 50%; transform: translateX(-50%); z-index: 1000; background: rgba(0,0,0,0.85); padding: 8px 20px; border-radius: 50px; border: 1px solid var(--accent); display: flex; gap: 20px; font-size: 0.65rem; font-family: 'JetBrains Mono'; backdrop-filter: blur(10px); }

        /* SIDE PANEL */
        .panel { padding: 24px; display: flex; flex-direction: column; gap: 20px; overflow-y: auto; background: var(--card); }
        .card { background: rgba(2, 6, 23, 0.5); border: 1px solid var(--border); padding: 18px; border-radius: 16px; margin-bottom: 10px; }
        
        .project-btn { width: 100%; background: transparent; border: 1px solid var(--border); color: white; padding: 12px; border-radius: 12px; text-align: left; cursor: pointer; transition: 0.3s; margin-bottom: 8px;}
        .project-btn:hover { border-color: var(--accent); }
        .project-btn.active { background: rgba(56, 189, 248, 0.1); border-color: var(--accent); border-left: 4px solid var(--accent); }

        /* REPORT BOX */
        .report-box { background: #fff; color: #1e293b; padding: 20px; border-radius: 12px; display: none; border-left: 8px solid var(--success); }
        .report-header { border-bottom: 2px solid #e2e8f0; margin-bottom: 10px; padding-bottom: 5px; font-weight: 800; font-size: 0.8rem; text-transform: uppercase; display: flex; justify-content: space-between;}
        .report-body { font-size: 0.75rem; line-height: 1.6; }
        .report-footer { margin-top: 15px; font-size: 0.6rem; color: #64748b; font-family: 'JetBrains Mono'; border-top: 1px dashed #cbd5e1; padding-top: 10px;}

        .btn-action { background: var(--accent); color: black; border: none; padding: 14px; border-radius: 10px; font-weight: 800; cursor: pointer; width: 100%; margin-top: 15px; text-transform: uppercase; }
        #inference-loader { display: none; font-family: 'JetBrains Mono'; font-size: 0.7rem; color: var(--warning); margin: 10px 0; }
    </style>
</head>
<body>

<div class="viewport">
    <div class="hud-top">
        <span><b style="color:var(--accent)">ENGINE:</b> U-NET V2 (SEMANTIC)</span>
        <span><b style="color:var(--accent)">STATUS:</b> <span id="status-text">CALIBRATED</span></span>
    </div>
    
    <div class="map-grid">
        <div id="map-before" class="map-frame"></div>
        <div id="map-after" class="map-frame"></div>
    </div>
</div>

<div class="panel">
    <header>
        <h2 style="margin:0; font-size:1.3rem;">Truth Engine <span style="color:var(--accent)">v3.1</span></h2>
        <p style="font-size: 0.75rem; color: #94a3b8;">Policy Verification Dashboard</p>
    </header>

    <div class="card">
        <h4 style="font-size: 0.6rem; color: var(--accent); letter-spacing: 1px;">AUDIT QUEUE</h4>
        <button class="project-btn" onclick="runNationalAudit('flood')">
            <b>🌊 Sector 62: Flood Mitigation</b><br>
            <span style="font-size:0.65rem; color:#94a3b8;">Check if drains were cleared</span>
        </button>
        <button class="project-btn" onclick="runNationalAudit('safety')">
            <b>🌉 NH-24: School Safety Bridge</b><br>
            <span style="font-size:0.65rem; color:#94a3b8;">Check if pedestrian bridge is built</span>
        </button>
    </div>

    <div id="inference-loader">>> ANALYZING PIXELS...</div>

    <div id="report-card" class="report-box">
        <div class="report-header">
            <span>Audit Briefing Report</span>
            <span id="report-date" style="color:#64748b"></span>
        </div>
        <div class="report-body">
            <p id="simple-summary"></p>
            <p id="simple-outcome" style="font-weight: 700; color: #15803d;"></p>
        </div>
        <div class="report-footer">
            <b>TECH DATA:</b> <span id="tech-data"></span><br>
            <b>VERDICT:</b> IMPLEMENTATION CONFIRMED
        </div>
        <button class="btn-action" onclick="window.print()">Download Official Report</button>
    </div>
</div>

<script>
    let m1, m2;
    const initialPos = [28.6289, 77.37];

    function initMaps() {
        m1 = L.map('map-before', { zoomControl: false, attributionControl: false }).setView(initialPos, 16);
        m2 = L.map('map-after', { zoomControl: false, attributionControl: false }).setView(initialPos, 16);
        const url = 'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}';
        L.tileLayer(url).addTo(m1);
        L.tileLayer(url).addTo(m2);
        m1.sync(m2); m2.sync(m1);
    }

    const auditMeta = {
        flood: {
            coords: [28.6295, 77.368],
            summary: "Our AI looked at Sector 62 to see if the new drainage system is working. By comparing satellite images from before and after the monsoon, we found that water is now flowing out much faster.",
            outcome: "The ground is significantly drier now, proving the drainage policy was successful.",
            tech: "NDWI (Moisture Index) dropped by 42.1% in target AOI."
        },
        safety: {
            coords: [28.624, 77.365],
            summary: "We scanned the NH-24 highway near the school zone. Our system detected a new concrete structure exactly where the Pedestrian Bridge was supposed to be built.",
            outcome: "The bridge is physically present and ready for student use.",
            tech: "NDBI (Built-up Index) increased by 65.8%; geometric match 98%."
        }
    };

    function runNationalAudit(type) {
        const data = auditMeta[type];
        document.getElementById('inference-loader').style.display = 'block';
        document.getElementById('report-card').style.display = 'none';
        document.getElementById('status-text').innerText = "AUDITING...";

        m1.flyTo(data.coords, 18);

        setTimeout(() => {
            document.getElementById('inference-loader').style.display = 'none';
            document.getElementById('report-card').style.display = 'block';
            document.getElementById('map-after').classList.add('ai-mask-active');
            
            document.getElementById('report-date').innerText = new Date().toLocaleDateString();
            document.getElementById('simple-summary').innerText = data.summary;
            document.getElementById('simple-outcome').innerText = "✅ " + data.outcome;
            document.getElementById('tech-data').innerText = data.tech;
            
            document.getElementById('status-text').innerText = "VERIFIED";
            document.getElementById('status-text').style.color = "var(--success)";
        }, 1500);
    }

    window.onload = initMaps;
</script>
</body>
</html>
